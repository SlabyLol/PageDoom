<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PageDoom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }
    #game-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
      display: block;
    }
    canvas:not(:focus) { opacity: 0.85; }
    canvas:focus { opacity: 1; }
    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.75);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      z-index: 20;
    }
    #mobile-controls {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #mobile-controls.visible { display: block; }
    .btn {
      pointer-events: auto;
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(40,40,40,0.75);
      color: white;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .btn:active, .btn.pressed {
      background: rgba(180,40,40,0.9);
      transform: scale(0.92);
    }
    #dpad {
      position: absolute;
      left: 16px;
      bottom: 24px;
      width: 160px;
      height: 160px;
    }
    #dpad .btn { width: 52px; height: 52px; font-size: 20px; }
    #up    { top: 0; left: 54px; }
    #left  { top: 54px; left: 0; }
    #down  { top: 108px; left: 54px; }
    #right { top: 54px; left: 108px; }
    #fire  { right: 28px; bottom: 110px; width: 72px; height: 72px; font-size: 18px; }
    #use   { right: 110px; bottom: 36px; }
    #run   { right: 28px; bottom: 36px; }
    #strafe{ right: 110px; bottom: 110px; }
    #menu  { top: 16px; right: 16px; width: 52px; height: 52px; font-size: 16px; }
    #help {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: 0.55;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="game-wrap">
      <div id="status">Loading Doom...</div>
      <canvas id="screen" tabindex="0"></canvas>
    </div>
  </div>

  <div id="mobile-controls">
    <div id="dpad">
      <button class="btn" id="up">▲</button>
      <button class="btn" id="left">◀</button>
      <button class="btn" id="down">▼</button>
      <button class="btn" id="right">▶</button>
    </div>
    <button class="btn" id="fire">FIRE</button>
    <button class="btn" id="use">USE</button>
    <button class="btn" id="run">RUN</button>
    <button class="btn" id="strafe">STR</button>
    <button class="btn" id="menu">ESC</button>
  </div>

  <div id="help">PC: Arrows/WASD · Ctrl=Fire · Space=Use · Shift=Run · Alt=Strafe · Esc=Menu</div>

  <script>
    const canvas = document.getElementById('screen');
    const status = document.getElementById('status');
    const mobileControls = document.getElementById('mobile-controls');

    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                     (navigator.maxTouchPoints > 1 && window.innerWidth < 900);

    if (isMobile) {
      mobileControls.classList.add('visible');
      document.getElementById('help').style.display = 'none';
    }

    let moduleMemory = null;
    let exports = null;
    let keysDown = new Set();

    function readUtf8(ptr, len) {
      const bytes = new Uint8Array(moduleMemory.buffer, ptr, len);
      return new TextDecoder('utf-8').decode(bytes);
    }

    function onGameInit(width, height) {
      canvas.width = width;
      canvas.height = height;
      status.style.display = 'none';
      canvas.focus();
    }

    function drawFrame(frameBufferPtr) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const src = new Uint8Array(moduleMemory.buffer, frameBufferPtr, w * h * 4);
      const img = ctx.createImageData(w, h);

      // Doom framebuffer is BGRA (little-endian ARGB) → convert to RGBA
      for (let i = 0; i < w * h; i++) {
        const s = i * 4;
        img.data[s + 0] = src[s + 2]; // R
        img.data[s + 1] = src[s + 1]; // G
        img.data[s + 2] = src[s + 0]; // B
        img.data[s + 3] = 255;        // A
      }
      ctx.putImageData(img, 0, 0);
    }

    function timeInMilliseconds() {
      return BigInt(Math.trunc(performance.now()));
    }

    const imports = {
      loading: {
        onGameInit: onGameInit,
        wadSizes: () => {},
        readWads: () => {}
      },
      ui: {
        drawFrame: drawFrame
      },
      runtimeControl: {
        timeInMilliseconds: timeInMilliseconds
      },
      console: {
        onInfoMessage: (ptr, len) => console.log('[Doom]', readUtf8(ptr, len)),
        onErrorMessage: (ptr, len) => console.error('[Doom]', readUtf8(ptr, len))
      },
      gameSaving: {
        sizeOfSaveGame: () => 0,
        readSaveGame: () => 0,
        writeSaveGame: () => 0
      }
    };

    function sendKey(down, code) {
      if (!exports) return;
      if (down) {
        if (!keysDown.has(code)) {
          keysDown.add(code);
          exports.reportKeyDown(code);
        }
      } else {
        if (keysDown.has(code)) {
          keysDown.delete(code);
          exports.reportKeyUp(code);
        }
      }
    }

    // Keyboard
    function getDoomKey(e) {
      if (!exports) return null;
      const map = {
        ArrowLeft: exports.KEY_LEFTARROW,
        ArrowRight: exports.KEY_RIGHTARROW,
        ArrowUp: exports.KEY_UPARROW,
        ArrowDown: exports.KEY_DOWNARROW,
        a: exports.KEY_LEFTARROW, A: exports.KEY_LEFTARROW,
        d: exports.KEY_RIGHTARROW, D: exports.KEY_RIGHTARROW,
        w: exports.KEY_UPARROW, W: exports.KEY_UPARROW,
        s: exports.KEY_DOWNARROW, S: exports.KEY_DOWNARROW,
        Control: exports.KEY_FIRE,
        ' ': exports.KEY_USE,
        Shift: exports.KEY_SHIFT,
        Alt: exports.KEY_ALT,
        Escape: exports.KEY_ESCAPE,
        Enter: exports.KEY_ENTER,
        Tab: exports.KEY_TAB,
        Backspace: exports.KEY_BACKSPACE,
        ',': exports.KEY_STRAFE_L,
        '.': exports.KEY_STRAFE_R
      };
      if (map[e.key] !== undefined) return map[e.key];
      if (e.key.length === 1) return e.key.charCodeAt(0);
      return null;
    }

    canvas.addEventListener('keydown', e => {
      const k = getDoomKey(e);
      if (k !== null) {
        e.preventDefault();
        sendKey(true, k);
      }
    });
    canvas.addEventListener('keyup', e => {
      const k = getDoomKey(e);
      if (k !== null) {
        e.preventDefault();
        sendKey(false, k);
      }
    });

    // Mobile buttons
    function bindBtn(id, getCode) {
      const el = document.getElementById(id);
      const down = (e) => {
        e.preventDefault();
        el.classList.add('pressed');
        const code = getCode();
        if (code != null) sendKey(true, code);
      };
      const up = (e) => {
        e.preventDefault();
        el.classList.remove('pressed');
        const code = getCode();
        if (code != null) sendKey(false, code);
      };
      el.addEventListener('touchstart', down, { passive: false });
      el.addEventListener('touchend', up, { passive: false });
      el.addEventListener('touchcancel', up, { passive: false });
      el.addEventListener('mousedown', down);
      el.addEventListener('mouseup', up);
      el.addEventListener('mouseleave', up);
    }

    // Bind after exports are ready
    function setupMobile() {
      bindBtn('up',    () => exports.KEY_UPARROW);
      bindBtn('down',  () => exports.KEY_DOWNARROW);
      bindBtn('left',  () => exports.KEY_LEFTARROW);
      bindBtn('right', () => exports.KEY_RIGHTARROW);
      bindBtn('fire',  () => exports.KEY_FIRE);
      bindBtn('use',   () => exports.KEY_USE);
      bindBtn('run',   () => exports.KEY_SHIFT);
      bindBtn('strafe',() => exports.KEY_ALT);
      bindBtn('menu',  () => exports.KEY_ESCAPE);
    }

    // Start
    status.textContent = 'Loading WASM...';

    WebAssembly.instantiateStreaming(fetch('doom-v0.1.0.wasm'), imports)
      .then(({ instance }) => {
        exports = instance.exports;
        moduleMemory = exports.memory;

        setupMobile();

        status.textContent = 'Starting...';
        exports.initGame();

        // Doom runs at 35 FPS
        setInterval(() => exports.tickGame(), 1000 / 35);
      })
      .catch(err => {
        console.error(err);
        status.innerHTML = 'Failed to load doom-v0.1.0.wasm<br><small>' + err.message + '</small>';
      });
  </script>
</body>
</html>
